services:
  redis:
    image: redis:7-alpine
    container_name: bookingapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bookingapp-backend
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - API_PORT=3000
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
